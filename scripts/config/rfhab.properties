

# Dialecte de Hibernate
es.caib.rfhab.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# es.caib.rfhab.hibernate.dialect=org.hibernate.dialect.MySQLDialect      
# es.caib.rfhab.hibernate.dialect=org.hibernate.dialect.DB2Dialect
# es.caib.rfhab.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# es.caib.rfhab.hibernate.dialect=net.sf.hibernate.dialect.Oracle9Dialect

# es.caib.rfhab.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
# es.caib.rfhab.hibernate.query.substitutions=true 1, false 0
es.caib.rfhab.hibernate.show_sql=false
es.caib.rfhab.hibernate.format_sql=false


# Propietat que indica als projectes que activin les caracteristiques
# especials requerides en l'entorn de la CAIB (Govern Balear) si val true -->
es.caib.rfhab.iscaib=false


es.caib.rfhab.defaultlanguage=ca

es.caib.rfhab.defaultentitat=A123456789

es.caib.rfhab.development=false

#  Clau per encriptar l'identificador del fitxers a descarregar via web(IMPORTANT tamany de 16 caràcters) -->
es.caib.rfhab.encryptkey=1234567890123456

#  Llistat de Plugins per l'exportació de dades en els llistats (excel, ods, csv, ...) -->
# es.caib.rfhab.exportdataplugins=org.fundaciobit.plugins.exportdata.cvs.CSVPlugin,org.fundaciobit.plugins.exportdata.ods.ODSPlugin,org.fundaciobit.plugins.exportdata.excel.ExcelPlugin

# From per quan enviam correus
es.caib.rfhab.email.from=rfhab@rfhab.org

# Telèfon d’ajuda que apareix al peu de pàgina
es.caib.rfhab.ajuda.viatelefon=123456789

# Enllaç a la pàgina d’ajuda que apareix al peu de pàgina.
es.caib.rfhab.ajuda.viaweb=http://www.help.hl/help

# Email d’ajuda que apareix al peu de pàgina.
es.caib.rfhab.ajuda.viaemail=help@help.hl

# URLs
es.caib.rfhab.url.back=http://localhost:8080/rfhabback
es.caib.rfhab.url.front=http://localhost:8080/rfhabfront






